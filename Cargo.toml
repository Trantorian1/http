[workspace]
resolver = "3"
members = ["http_1", "http_primitives"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

# Kani

[workspace.metadata.kani.unstable]
quantifiers = true
loop-contracts = true
function-contracts = true
stubbing = true

# Bolero

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

# Lints

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

shadow_same = "forbid"
shadow_reuse = "forbid"
shadow_unrelated = "forbid"

print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
todo = "warn"

unwrap_used = "forbid"
expect_used = "forbid"

undocumented_unsafe_blocks = "warn"
clone_on_ref_ptr = "warn"
str_to_string = "warn"
semicolon_if_nothing_returned = "warn"

[workspace.dependencies]
# http
http_1.path = "http_1"
http_primitives.path = "http_primitives"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Parsing
memchr = "2.8.3"

# Testing
rstest = "0.26.1"
pretty_assertions = "1.4.1"
bolero = "0.13.4"
