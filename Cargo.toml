[workspace]
resolver = "3"
members = ["http_1", "http_primitives"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

# Kani

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.metadata.kani.unstable]
quantifiers = true
loop-contracts = true

# Bolero

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
# http
http_1.path = "http_1"
http_primitives.path = "http_primitives"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Parsing
memchr = "2.8.3"

# Testing
rstest = "0.26.1"
pretty_assertions = "1.4.1"
bolero = "0.13.4"
